name: Bug report
description: Report something that is broken in Converse.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Converse. For questions and ideas, use Discussions.
        This is public: remove credentials, account emails, private paths, and conversation contents from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Converse version
      description: Find it in About Converse.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac processor
      placeholder: "macOS version; Apple Silicon or Intel"
    validations:
      required: true
  - type: dropdown
    id: assistant
    attributes:
      label: Assistant involved
      multiple: true
      options:
        - Muse
        - Claude Code
        - Codex
        - App interface / no assistant
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant CLI version and whether this involves an additional account, if applicable.
      placeholder: "1. Open…\n2. Click…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshots or error messages
      description: Share only information you are comfortable making public. Remove secrets and personal details first.
